module_name: ekf2
parameters:
- group: EKF2
  definitions:
    EKF2_AB_MODE:
      description:
        short: One-shot attitude bootstrap mode
        long: >-
          Required mode waits for a validated full body-FRD to true-north NED
          attitude from the configured source before initializing the EKF. There
          is no fallback to accelerometer initialization. Single EKF only
          (SENS_IMU_MODE=1). All sensor fusion and preflight checks remain active.
          Latched at EKF startup; reboot after changing this parameter.
      type: enum
      values:
        0: Disabled
        1: Required before initialization
      default: 0
      reboot_required: true
    EKF2_AB_SYS:
      description:
        short: Attitude bootstrap source system ID
      type: int32
      default: 1
      min: 1
      max: 255
    EKF2_AB_COMP:
      description:
        short: Attitude bootstrap source component ID
      type: int32
      default: 1
      min: 1
      max: 255
    EKF2_AB_AGE:
      description:
        short: Maximum attitude bootstrap sample age
        long: >-
          Includes timestamp mapping uncertainty. The sample must additionally
          be newer than the EKF delayed IMU horizon, so transport delay must fit
          EKF2_DELAY_MAX. The age gate is checked again while waiting to apply.
      type: float
      default: 500
      min: 10
      max: 1000
      unit: ms
    EKF2_AB_TUNC:
      description:
        short: Maximum bootstrap timestamp uncertainty
      type: float
      default: 10
      min: 0
      max: 100
      unit: ms
    EKF2_AB_TILT:
      description:
        short: Maximum bootstrap tilt standard deviation
        long: Applies independently to the two horizontal NED rotation-vector axes.
      type: float
      default: 2
      min: 0.1
      max: 3
      unit: deg
    EKF2_AB_YAW:
      description:
        short: Maximum bootstrap heading standard deviation
      type: float
      default: 5
      min: 0.1
      max: 10
      unit: deg
